forbidden_phrases:
  - code: "2.1"
    section: "Медицинские утверждения"
    description: "«Лечит/излечивает/избавляет от» — обещание лечения заболевания"
    blocking: true
    scopes: ["source", "body"]
    patterns:
      - "(?i)\\bлечит\\b"
      - "(?i)\\bизлечивает\\b"
      - "(?i)\\bвылечивает\\b"
      - "(?i)избавляет от\\b"
  - code: "2.2"
    section: "Медицинские утверждения"
    description: "Гарантии результата («100% результат», «гарантированный эффект»)"
    blocking: true
    scopes: ["source", "body"]
    patterns:
      - "100\\s?%\\s*(результат|эффект)"
      - "(?i)гарантир\\w*\\s+результат"
  - code: "2.12"
    section: "Медицинские утверждения"
    description: "Прогноз длительности эффекта («навсегда»)"
    blocking: true
    scopes: ["source", "body"]
    patterns:
      - "(?i)\\bнавсегда\\b"
  - code: "8.20"
    section: "Специфика БАД"
    description: "«Вечный результат/эффект»"
    blocking: true
    scopes: ["source", "body"]
    patterns:
      - "(?i)вечный (эффект|результат)"
  - code: "4.3"
    section: "Закон о русском языке"
    description: "Рекламные слоганы без перевода (SALE/NEW/HIT и т.п.)"
    blocking: true
    scopes: ["body"]
    patterns:
      - "\\bSALE\\b"
      - "\\bHIT\\b"
      - "\\bNEW\\b"
  - code: "3.9"
    section: "Реклама"
    description: "Манипулятивные фразы («только сегодня», «спешите»)"
    blocking: false
    scopes: ["body"]
    patterns:
      - "(?i)только сегодня"
      - "(?i)\\bспешите\\b"
      - "(?i)только сейчас"
  - code: "6.7"
    section: "Этика"
    description: "Сенсационные заголовки («шокирующие результаты»)"
    blocking: false
    scopes: ["body"]
    patterns:
      - "(?i)шокирующ\\w* результат"
      - "(?i)шокирующ\\w* эффект"

required_elements:
  - code: "5.11"
    section: "Общие требования к сайту"
    description: "Нет ссылки на Политику конфиденциальности в футере"
    blocking: true
    scope: "footer"
    applies_to: ["all"]
    patterns:
      - "(?i)политика конфиденциальности"
    href_patterns:
      - "/privacy"
  - code: "5.12"
    section: "Общие требования к сайту"
    description: "Нет ссылки на Пользовательское соглашение в футере"
    blocking: true
    scope: "footer"
    applies_to: ["all"]
    patterns:
      - "(?i)пользовательское соглашение"
    href_patterns:
      - "/user-agreement"
  - code: "5.1"
    section: "Общие требования к сайту"
    description: "Нет данных о продавце (ИНН/ОГРН) в футере"
    blocking: true
    scope: "footer"
    applies_to: ["all"]
    patterns:
      - "(?i)инн\\s*\\d{10,12}"
      - "\\bОГРН\\b"
    href_patterns: []
  - code: "5.4"
    section: "Общие требования к сайту"
    description: "Нет плашки «БАД. Не является лекарством»"
    blocking: true
    scope: "body"
    applies_to: ["home", "category", "product", "landing"]
    patterns:
      - "(?i)БАД\\.?\\s*Не является лекарств"
      - "(?i)не является лекарственным средством"
    href_patterns: []
  - code: "5.5"
    section: "Общие требования к сайту"
    description: "Нет упоминания противопоказаний / консультации врача"
    blocking: true
    scope: "body"
    applies_to: ["home", "category", "product", "landing"]
    patterns:
      - "(?i)противопоказани"
    href_patterns: []

english_ui:
  whitelist:
    - "daigo"
    - "e-mail"
    - "email"
    - "ph"
  groups:
    - code: "4.2"
      blocking: true
      selector: "button, a[role='button'], input[type='submit'], input[type='button']"
    - code: "4.6"
      blocking: true
      selector: "nav a, header nav *, [class*='menu'] a, [class*='filter'] a, [class*='filter'] button"

caps_lock:
  code: "4.11"
  section: "Закон о русском языке"
  description: "Капслок в сплошном тексте (не заголовок/акцент)"
  blocking: false
  max_allowed_words: 3

promo_deadline:
  code: "3.6"
  section: "Реклама"
  description: "Упоминание акции/скидки без явного срока действия рядом в тексте"
  blocking: false
  trigger_patterns:
    - "(?i)скидк"
    - "(?i)\\bакци"
    - "(?i)распродаж"
  deadline_patterns:
    - "\\d{1,2}[./]\\d{1,2}([./]\\d{2,4})?"
    - "(?i)до \\d{1,2}\\s"
    - "(?i)по \\d{1,2}\\s"
    - "(?i)действует до"
    - "(?i)срок действия"

visual_checklist:
  - code: "8.1"
    section: "Специфика БАД"
    description: "Медицинская символика (крест, кадуцей)"
    blocking: true
  - code: "8.9"
    section: "Специфика БАД"
    description: "Образ врача в белом халате без маркировки «реклама»"
    blocking: true
  - code: "8.16"
    section: "Специфика БАД"
    description: "Государственная символика (герб, флаг)"
    blocking: true
  - code: "9.1"
    section: "Визуальный контент"
    description: "Низкое качество / размытые изображения"
    blocking: false
  - code: "9.2"
    section: "Визуальный контент"
    description: "Некорректные фото «до/после» (похоже на монтаж/несогласованно)"
    blocking: false
  - code: "9.3"
    section: "Визуальный контент"
    description: "Стоковое фото с водяным знаком"
    blocking: false
  - code: "9.4"
    section: "Визуальный контент"
    description: "Непрофессиональные фото продукции (любительские снимки, плохой свет)"
    blocking: false
  - code: "9.5"
    section: "Визуальный контент"
    description: "Фото еды рядом с БАД без явной пометки согласования"
    blocking: false
