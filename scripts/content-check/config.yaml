run:
  max_pages_per_run: 20
  confidence_threshold: "medium"

playwright:
  navigation_timeout_ms: 30000
  wait_until: "networkidle"
  max_retries: 3
  viewport:
    width: 1440
    height: 900

anthropic:
  model: "claude-sonnet-5"
  max_tokens: 1024
  timeout_seconds: 60
  max_retries: 3

source_scan:
  root: "."
  include_globs:
    - "components/**/*.vue"
    - "pages/**/*.vue"
    - "layouts/**/*.vue"
    - "app.vue"
    - "content/**/*.json"
  exclude_dirs:
    - "node_modules"
    - ".nuxt"
    - ".output"
    - "tests"
    - ".git"

